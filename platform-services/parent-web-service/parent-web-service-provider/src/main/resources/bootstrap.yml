server:
  port: 8054

spring:
  application:
    name: parent-web-service-provider
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      config:
        file-extension: yml
        server-addr: ${config.server-addr}
        namespace: ${config.namespace}
        shared-configs:
          - {dataId: db.yml, refresh: true}
          - {dataId: jwt.yml, refresh: true}
          - {dataId: redis.yml, refresh: true}
      discovery:
        namespace: ${config.namespace}
        server-addr: ${discovery.server-addr}


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ershiyi.domain.entity

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'

#showSql
logging:
  level:
    com:
      ershiyi:
        mapper: debug
