server:
  port: 8053

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1000MB
  application:
    name: student-app-service-provider
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      config:
        file-extension: yml
        server-addr: 192.168.1.13:8848
        namespace: 
        shared-configs:
          - {dataId: db.yml, refresh: true}
          - {dataId: jwt.yml, refresh: true}
          - {dataId: redis.yml, refresh: true}
      discovery:
        namespace: 
        server-addr: 192.168.1.13:8848


mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.ershiyi.domain

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'

#showSql
logging:
  level:
    com:
      ershiyi:
        mapper: debug
