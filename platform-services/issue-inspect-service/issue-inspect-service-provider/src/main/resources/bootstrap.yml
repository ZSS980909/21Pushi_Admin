mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.ershiyi.domain

feign:
  sentinel:
    enabled: true



management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    com.ershiyi: error
  file:
    name: issue-inspect-service.log
